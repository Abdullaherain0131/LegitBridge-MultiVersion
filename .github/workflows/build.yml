name: Build LegitBooster

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build 1.16.5
      run: ./gradlew :1.16.5:build
      
    - name: Upload 1.16.5 Artifact
      uses: actions/upload-artifact@v3
      with:
        name: LegitBooster-1.16.5
        path: versions/1.16.5/build/libs/legitbooster-*.jar
